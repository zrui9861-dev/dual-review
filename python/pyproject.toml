[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dual-agent-sdk"
version = "0.1.0"
description = "Dual-agent orchestration SDK with Generator-Critic pattern and anti-loop convergence protocol"
# readme = "../README.md"  # uncomment when README.md exists
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.30.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
